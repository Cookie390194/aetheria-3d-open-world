<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aetheria 3D Open World</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#79b9d4;font-family:system-ui;color:#fff}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none;padding:18px;text-shadow:0 2px 3px #000}h1{margin:0;font-size:20px}.box{background:#07152bbd;border:1px solid #b7eaff88;border-radius:12px;padding:10px 13px;margin-top:9px;width:max-content}.quest{position:absolute;right:18px;top:18px;text-align:right}.hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}.key{border:1px solid #bfe6ff;border-radius:5px;padding:1px 6px;background:#14345b}.msg{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);font-size:20px;text-align:center;opacity:0;transition:.2s}.buttons{position:fixed;bottom:20px;right:20px;display:grid;grid-template-columns:58px 58px;gap:8px}.buttons button{pointer-events:auto;height:52px;border:1px solid #96dfff;background:#11345be6;color:white;border-radius:14px;font-size:22px}@media(max-width:600px){.quest{display:none}.hint{font-size:12px;white-space:normal;width:90%}}</style></head><body><canvas id="c"></canvas><div id="ui"><h1>✦ AETHERIA</h1><div class="box">3D-Open-World-Prototyp • Erkunde die Landschaft</div><div class="quest box"><b>Quest: Der verschwundene Stern</b><br><span id="status">Folge dem goldenen Licht.</span></div><div id="msg" class="msg"></div><div class="hint box"><span class="key">W</span><span class="key">S</span> laufen · <span class="key">A</span><span class="key">D</span> drehen · <span class="key">E</span> interagieren</div></div><div class="buttons"><button id="l">↶</button><button id="w">↑</button><button id="s">↓</button><button id="r">↷</button></div><script>const c=document.querySelector('#c'),ctx=c.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();let p={x:0,y:0,a:0},k={},done=false;const star={x:580,y:-180},trees=[],rocks=[];for(let i=0;i<100;i++){let a=Math.random()*7,r=150+Math.random()*1300;trees.push({x:Math.cos(a)*r,y:Math.sin(a)*r,s:18+Math.random()*35})}for(let i=0;i<40;i++)rocks.push({x:(Math.random()-.5)*2000,y:(Math.random()-.5)*1700,s:7+Math.random()*17});addEventListener('keydown',e=>{k[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>k[e.key.toLowerCase()]=0);[['l','a'],['r','d'],['w','w'],['s','s']].forEach(([id,key])=>{let b=document.getElementById(id);b.onpointerdown=()=>k[key]=1;b.onpointerup=b.onpointerleave=()=>k[key]=0});function pos(o){return[W/2+o.x-p.x,H/2+o.y-p.y]}function interact(){if(Math.hypot(p.x-star.x,p.y-star.y)<110&&!done){done=1;status.textContent='Stern gefunden – erkunde die Welt frei.';show('✦ Du hast den Stern gefunden!')}else show('Hier gibt es nichts zu untersuchen.')}let timer=0;function show(t){msg.textContent=t;msg.style.opacity=1;timer=180}function loop(){requestAnimationFrame(loop);if(k.a)p.a-=.06;if(k.d)p.a+=.06;if(k.w){p.x+=Math.cos(p.a)*4;p.y+=Math.sin(p.a)*4}if(k.s){p.x-=Math.cos(p.a)*4;p.y-=Math.sin(p.a)*4}let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#71c6ed');g.addColorStop(.45,'#d9f1d3');g.addColorStop(1,'#4f9b62');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#c9ac75';ctx.lineWidth=75;ctx.beginPath();ctx.moveTo(...pos({x:-900,y:250}));ctx.quadraticCurveTo(W/2,H/2,...pos({x:1000,y:-300}));ctx.stroke();for(let t of trees){let q=pos(t);if(q[0]<-80||q[0]>W+80||q[1]<-80||q[1]>H+80)continue;ctx.fillStyle='#5d412c';ctx.fillRect(q[0]-4,q[1],8,t.s);ctx.fillStyle='#246b48';ctx.beginPath();ctx.arc(q[0],q[1]-t.s*.35,t.s*.6,0,7);ctx.fill()}for(let r of rocks){let q=pos(r);ctx.fillStyle='#6c858b';ctx.beginPath();ctx.arc(q[0],q[1],r.s,0,7);ctx.fill()}let q=pos(star),gl=ctx.createRadialGradient(q[0],q[1],2,q[0],q[1],75);gl.addColorStop(0,'#fff');gl.addColorStop(.3,'#ffd95b99');gl.addColorStop(1,'#ffd95b00');ctx.fillStyle=gl;ctx.fillRect(q[0]-75,q[1]-75,150,150);ctx.fillStyle='#fff1a0';ctx.beginPath();for(let i=0;i<10;i++){let rr=i%2?12:27,aa=-1.57+i*Math.PI/5;ctx.lineTo(q[0]+Math.cos(aa)*rr,q[1]+Math.sin(aa)*rr)}ctx.fill();let u=pos(p);ctx.save();ctx.translate(...u);ctx.rotate(p.a);ctx.fillStyle='#283d91';ctx.beginPath();ctx.arc(0,5,19,0,7);ctx.fill();ctx.fillStyle='#efb38e';ctx.beginPath();ctx.arc(0,-14,12,0,7);ctx.fill();ctx.fillStyle='#edf6ff';ctx.beginPath();ctx.moveTo(0,-43);ctx.lineTo(10,-20);ctx.lineTo(-10,-20);ctx.fill();ctx.restore();if(Math.hypot(p.x-star.x,p.y-star.y)<140&&!done)status.textContent='Der Stern ist nahe. Drücke E.';if(timer--<=0)msg.style.opacity=0}loop();</script></body></html>
